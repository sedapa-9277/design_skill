<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>퀘스트 보드 — 할 일 사냥</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-stars" aria-hidden="true"></div>

  <main class="app">
    <!-- 영웅 상태창 -->
    <section class="hero-panel" id="heroPanel">
      <div class="hero-avatar" id="heroAvatar">🧙</div>
      <div class="hero-info">
        <div class="hero-top">
          <div>
            <p class="hero-title" id="heroTitle">견습 모험가</p>
            <h1 class="hero-name">Lv. <span id="heroLevel">1</span></h1>
          </div>
          <div class="hero-stats">
            <div class="stat"><span class="stat-icon">⚔️</span><span id="statKills">0</span><small>처치</small></div>
            <div class="stat"><span class="stat-icon">💰</span><span id="statGold">0</span><small>골드</small></div>
            <div class="stat"><span class="stat-icon">🔥</span><span id="statStreak">0</span><small>연속일</small></div>
          </div>
        </div>
        <div class="xp-bar" role="progressbar" aria-label="경험치" id="xpBar">
          <div class="xp-fill" id="xpFill"></div>
          <span class="xp-text" id="xpText">0 / 100 XP</span>
        </div>
      </div>
    </section>

    <!-- 몬스터 소환 폼 -->
    <section class="summon">
      <h2 class="section-title">📜 새 몬스터 출현</h2>
      <form id="summonForm" class="summon-form" autocomplete="off">
        <input id="taskInput" type="text" maxlength="60" placeholder="처리할 할 일을 입력하세요 (예: 보고서 작성)" required />
        <div class="tier-picker" id="tierPicker" role="radiogroup" aria-label="난이도"></div>
        <div class="summon-row">
          <label class="due-label">
            ⏳ 기한
            <input id="dueInput" type="date" />
          </label>
          <button type="submit" class="btn btn-summon">소환하기</button>
        </div>
      </form>
    </section>

    <!-- 전장 -->
    <section class="battlefield">
      <div class="battle-head">
        <h2 class="section-title">⚔️ 전장 <span class="count" id="monsterCount">0</span></h2>
        <div class="filters" id="filters">
          <button class="chip active" data-filter="all">전체</button>
        </div>
      </div>
      <div class="monster-grid" id="monsterGrid"></div>
      <div class="empty" id="emptyState" hidden>
        <div class="empty-icon">🏞️</div>
        <p>전장이 평화롭습니다.<br />새 몬스터(할 일)를 소환해 사냥을 시작하세요!</p>
      </div>
    </section>

    <!-- 처치 기록 -->
    <section class="log">
      <div class="battle-head">
        <h2 class="section-title">🏆 사냥 기록</h2>
        <button class="btn-link" id="resetBtn">모험 초기화</button>
      </div>
      <ul class="log-list" id="logList"></ul>
    </section>
  </main>

  <!-- 레벨업 연출 -->
  <div class="levelup" id="levelUp" hidden>
    <div class="levelup-card">
      <div class="levelup-burst"></div>
      <p class="levelup-label">LEVEL UP!</p>
      <p class="levelup-level">Lv. <span id="luLevel">2</span></p>
      <p class="levelup-title" id="luTitle"></p>
      <button class="btn btn-summon" id="luClose">계속 사냥하기</button>
    </div>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>

  <script src="script.js"></script>
</body>
</html>
